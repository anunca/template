version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /go/fiber/src
      - /go/go/src
      - /go/revel/src
      - /go/revel/src/app
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /java/spring-gradle/src
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java/spring-maven/src
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /javascript/express/src
      - /javascript/nodejs/tmp
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories:
      - /dotnet
      - /go/fiber
      - /go/go
      - /go/revel
      - /java/spring-gradle
      - /java/spring-maven
      - /javascript/express
      - /javascript/nodejs
      - /javascript/react
      - /javascript/serverless
      - /php/laravel-apache
      - /php/laravel-nginx
      - /php/symfony-apache
      - /php/symfony-nginx
      - /python/django
      - /python/flask
    schedule:
      interval: monthly

# Composer, pip, and NuGet can be enabled once their project manifests are committed.

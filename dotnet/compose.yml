services:
  app:
    depends_on:
      - db
    build:
      target: ${ENV}
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_SDK_VERSION:
        DOTNET_RUNTIME_VERSION:
    image: $APP_IMAGE
  db:
    image: $MSSQL_IMAGE
    volumes:
      - db:/var/opt/mssql/data
    environment:
      - MSSQL_PID=Developer
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Sasa!0s0
volumes:
  db:

services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE:
    image: $IMAGE
    ports:
      - 80:3000
      - 8080:3002
    volumes:
      - ./src:/app
      - node_modules:/app/node_modules
      - ~/.aws:/root/.aws
    environment:
      SLS_DEBUG:
volumes:
  node_modules:
